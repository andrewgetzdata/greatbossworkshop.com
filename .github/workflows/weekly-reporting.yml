name: Weekly reporting

on:
  schedule:
    # Mondays 11:00 UTC = 6:00 AM EST (7:00 AM EDT during daylight saving).
    - cron: "0 11 * * 1"
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate & email weekly PDF report
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EXPORT_RECIPIENTS: ${{ secrets.EXPORT_RECIPIENTS }}
        run: npx tsx scripts/weekly-report.ts
